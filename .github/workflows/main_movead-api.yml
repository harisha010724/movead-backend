# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - movead-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # No `npm run test` here on purpose. The suite takes a Postgres advisory
      # lock and truncates tables between files, so it needs a live Postgres and
      # Redis; on a bare runner it fails and the deploy job never runs.
      - name: Install and build
        run: |
          npm ci
          npm run build

      # One zip instead of ~40k individual file uploads.
      #
      # Deliberately more than `dist/`: `openapi/` is read from disk at runtime,
      # and `.sequelizerc` points the migration CLI at `src/db/migrations` and
      # `src/db/config.js`, which are plain CommonJS and never compiled into
      # `dist/`. There is also no `npm prune --omit=dev`, because migrations run
      # over SSH against this tree and `sequelize-cli` is a devDependency.
      - name: Zip artifact for deployment
        run: zip -qr release.zip . -x '.git/*' '.github/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4A31FE642C6D4BDB8ADCD13F9A3B9414 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_69CE9D9E721A45AEA0C22C4E2BA77F13 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A93E81AE33D74BF09FFE86C3C5871287 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'movead-api'
          slot-name: 'Production'
          package: release.zip
